server:
  port: 8090 # 项目启动端口

# OpenAPI 文档：/swagger-ui.html 与 /v3/api-docs
springdoc:
  api-docs:
    path: /v3/api-docs # OpenAPI JSON 描述文件
    enabled: true
  swagger-ui:
    path: /swagger-ui.html # Swagger UI 页面
    enabled: true
    operations-sorter: method # 按方法名排序
    tags-sorter: alpha # 按分组名排序
    display-request-duration: true # 显示请求耗时
  packages-to-scan: com.quanxiaoha.vector.store # 只扫描本项目的包
  default-produces-media-type: application/json

app:
  embedding-index:
    enabled: true # 启动时把文档写入 Redis（固定 id，重复启动只覆盖不追加）
    # 启动时灌入哪些格式：txt/json/md/html/pdf/word/ppt/all，多个用逗号分隔
    # 只想灌 PDF 就写 pdf；不需要种子数据就设 enabled: false
    sources: all
  rag:
    top-k: 5 # RAG 检索时取回多少条资料作为上下文
    similarity-threshold: 0.0 # 相似度阈值，低于该值的文档不进入上下文
  reader:
    pdf:
      # 每个 Document 覆盖几页。0 = ALL_PAGES，整份 PDF 合成一条 Document（1 个 key / 1 个向量）
      # 1 = 每页一条 Document（每页一个 key，检索能精确定位到页）
      pages-per-document: 1
    tika:
      # Word / PPT 等 Office 文档的切块参数（Apache Tika 解析后切分）
      chunk-size: 1000 # 每个分块的目标 token 数
      min-chunk-size-chars: 400 # 标点符号截断阶段的字符下限
      min-chunk-length-to-embed: 10 # 允许入库的最小字符长度，小于此长度的块会被丢弃
      max-num-chunks: 5000 # 单个文档最多生成的块数
  okhttp: # OkHttp 客户端配置（调用 SearXNG 联网搜索）
    connect-timeout: 5000    # 建立连接的最大等待时间（毫秒）
    read-timeout: 30000      # 读取数据的最大等待时间（毫秒）
    write-timeout: 15000     # 写入数据的最大等待时间（毫秒）
    max-idle-connections: 200 # 连接池中保持的最大空闲连接数
    keep-alive-duration: 5   # 空闲连接在连接池中的存活时间（分钟）
  searxng: # SearXNG 搜索引擎配置
    url: http://192.168.100.101:8888/search # SearXNG 服务的 API 端点地址
    count: 50                # 每次从搜索结果中，提取的最大数量（也是接口返回条数的上限）
    # 聚合的搜索引擎，多个用逗号分隔。留空 = 用 SearXNG 默认的全部已启用引擎，
    # 这样在 SearXNG 界面里勾选新引擎后这边不用改；
    # 想固定用哪几个（比如跳过墙掉的）就写死，如 bing,360search
    engines: ""
    language: zh-CN          # 搜索语言
    safesearch: 0            # 0-关闭 1-中等 2-严格
  network: # 联网搜索增强参数（抓网页正文，拼增强提示词）
    max-pages: 10            # 最多抓取多少个网页正文作为上下文（按相关性评分从高到低取）
    content-length: 2000     # 每个网页最多保留多少字符正文
    fetch-timeout: 15        # 单次网页抓取的超时时间（秒）
    retries: 1               # 单个网页抓取失败后的重试次数（有些站点会间歇性丢连接）
    max-context-length: 20000 # 所有网页正文拼起来后的最大字符数，防止提示词超出模型上下文窗口

spring:
  application:
    name: xiaoha-vector-store-search

  profiles:
    # 本地开发加载 application-local.yaml（存放 API Key 等敏感配置，已被 .gitignore 忽略）
    active: local

  data:
    redis:
      host: 192.168.100.101 # Redis URL 链接
      port: 6379 # Redis 端口
      client-type: jedis # Redis 客户端使用 Jedis
      timeout: 5s # 命令读写超时
      connect-timeout: 5s # 建立连接超时
      jedis:
        pool:
          enabled: true # 开启连接池
          max-active: 16 # 最大活跃连接数
          max-idle: 8 # 最大空闲连接数
          min-idle: 2 # 最小空闲连接数
          max-wait: 3s # 等待可用连接的最长时间

  ai:
    openai:
      # 阿里云百炼 OpenAI 兼容接口
      # 若业务空间已授权本账号调用模型，可切换为空间专属域名：
      #   https://ws-oi5air7biu557n9.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
      base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      api-key: ${DASHSCOPE_API_KEY:} # 优先取环境变量；本地默认值见 application-local.yaml
      embedding:
        model: qwen3.7-text-embedding # 百炼当前最强文本向量模型，指令遵循较 text-embedding-v4 提升 16.4%
        options:
          # 官方推荐：语义检索效果与成本的最佳平衡点
          # 注意：Redis 索引的向量维度在 FT.CREATE 时固定，修改此处后必须先删除旧索引再重启
          #   redis-cli FT.DROPINDEX xiaoha-ai-index
          dimensions: 1024

    # 对话大模型：MiniMax。走 Anthropic 兼容接口，base-url 换成 MiniMax 官方域名即可。
    # 用环境变量注入，key 不落到代码库里：MINIMAX_API_KEY / ANTHROPIC_BASE_URL
    anthropic:
      api-key: ${MINIMAX_API_KEY:${ANTHROPIC_AUTH_TOKEN:}}
      base-url: ${MINIMAX_BASE_URL:${ANTHROPIC_BASE_URL:https://api.minimaxi.com/anthropic}}
      chat:
        options:
          model: ${MINIMAX_MODEL:MiniMax-M3}
          temperature: 0.0 # RAG 场景取 0，降低随机性、减少幻觉
          max-tokens: 4096 # Anthropic Messages API 要求必须带 max_tokens

    vectorstore:
      redis:
        initialize-schema: true # 是否初始化模式
        index-name: xiaoha-ai-index # 自定义索引名称
        prefix: embedding # 自定义键名前缀
